<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  [hidden] { display: none !important; }
  .day-hud { position: absolute; inset: 0 0 auto; display: flex; justify-content: space-between; gap: 16px; padding: 12px 18px; font-size: 18px; background: #10161c; }
  .day-overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; background: #081017b8; }
  .day-card { width: min(100%, 650px); max-height: 88vh; overflow: auto; box-sizing: border-box; padding: 28px; border: 1px solid #6c8792; border-radius: 14px; background: #172730; font-size: 18px; }
  .day-card h1 { margin: 0 0 12px; font-size: 32px; }
  .day-card p { margin: 8px 0 14px; }
  .day-card button, .day-hud button { margin: 6px 10px 0 0; padding: 8px 14px; border: 1px solid #83b9ad; border-radius: 8px; background: #25483f; color: #fff; font: inherit; cursor: pointer; }
  .day-card button:focus-visible, .day-hud button:focus-visible { outline: 3px solid #ffe4a1; }
  .day-card button:disabled { opacity: .65; cursor: default; }
  .day-hud p { margin: 0; }
  .day-hud button { flex: 0 0 auto; align-self: start; margin: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="day-hud" id="day-hud" hidden>
  <div><p id="day-title"></p><p id="day-details"></p></div>
  <button id="day-pause" type="button">Tạm dừng</button>
</header>
<div class="day-overlay" id="day-overlay" hidden><section class="day-card" id="day-card"></section></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap?.phase || snap?.mode || "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
function postInput(payload) { queue.push(JSON.stringify(payload)); flush(); }
function pressButton(name) { postInput({ [name]: true }); postInput({ [name]: false }); }
function uiAction(action) {
  fetch("/ui", { method: "POST", body: JSON.stringify({ action }), headers: { "Content-Type": "application/json" } })
    .catch(() => { offline = true; });
}
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.target instanceof HTMLButtonElement && (k === " " || k === "enter")) return;
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === "p" || k === "escape") down.add("pause");
  else if (k === "enter" && snap?.mode === "day" && snap.ui?.screen) uiAction("continue");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển", canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
const STOVE_LABEL = { idle: "Trống", cooking: "Đang nấu", ready: "Đã chín" };
const dishName = (id) => DISH_NAME[id] || id;

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = snap.mode === "day" ? 112 : 64, bottom = 68;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  for (const monster of snap.monsters || []) {
    const x = sx(monster.pos[0]), y = sy(monster.pos[1]);
    ctx.fillStyle = monster.state === "chase" ? "#b24b3e" : "#739c62";
    ctx.beginPath();
    ctx.ellipse(x, y, 1.4 * s, 0.62 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#f5de95";
    ctx.lineWidth = 2;
    ctx.stroke();
    text(`Cá sấu ${monster.id}`, x, y - 0.85 * s, { size: 14, align: "center" });
  }
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  if (snap.mode !== "day") {
    text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
    if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
      const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
      bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    }
    if (p && p.hp !== undefined && p.hp_max) {
      let hs = "";
      for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
      text(hs, 345, 29, { size: 22, color: "#ff6b81" });
    }
    if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
    if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  }
  // giỏ (khoang) dưới
  if (snap.mode !== "day" && snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function availableStock(snapshot) {
  const stock = { ...snapshot.stock };
  for (const customer of snapshot.customers || []) {
    for (const [kind, amount] of Object.entries(customer.reserved || {})) {
      stock[kind] = (stock[kind] ?? 0) - amount;
    }
  }
  return Object.entries(stock)
    .filter(([, amount]) => amount !== 0)
    .map(([kind, amount]) => `${KIND_NAME[kind] || kind} ×${amount}`)
    .join(", ");
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = snap.mode === "day" ? 112 : 88, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(x - 0.8 * s, y - 0.8 * s, 1.6 * s, 1.6 * s);
    if (st.dish) text(dishName(st.dish.dish_id), x, y - 0.8 * s - 7, { size: 13, align: "center", color: "#2a1a0a" });
    const status = STOVE_LABEL[st.state] || st.state;
    const timer = st.state === "cooking" ? ` · ${fmtTime(st.cook_ticks_left)}` : "";
    text(`${st.id} · ${status}${timer}`, x, y + 0.8 * s + 16, { size: 13, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(`${c.id} · ${dishName(c.dish_id)}`, cx, cy - 0.75 * s, { size: 13, align: "center", color: "#2a1a0a" });
      if (c.state === "eating") {
        text(`Đang ăn · ${fmtTime(c.eat_ticks_left)}`, cx, cy + 4, { size: 12, align: "center", color: "#2a1a0a" });
      } else if (c.patience_ticks_left !== undefined) {
        const width = Math.max(76, 1.7 * s);
        bar(cx - width / 2, cy + 0.55 * s, width, 16, c.patience_ticks_left / patMax, "#9c4541", `Chờ ${fmtTime(c.patience_ticks_left)}`);
      }
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  // HUD
  if (snap.mode !== "day") {
    text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
    text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
    text("Kho khả dụng: " + (availableStock(snap) || "trống"), 14, 52, { size: 13, color: "#cfd8dc" });
    const hand = snap.hand ? `${dishName(snap.hand.dish_id)} · ${snap.hand.order_id}` : "trống";
    text("Đang cầm: " + hand, 14, 72, { size: 13, color: "#cfd8dc" });
  }
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

const dayHud = document.getElementById("day-hud");
const dayOverlay = document.getElementById("day-overlay");
const dayCard = document.getElementById("day-card");
const dayTitle = document.getElementById("day-title");
const dayDetails = document.getElementById("day-details");
const dayPause = document.getElementById("day-pause");
const PHASE_LABEL = { gather: "Buổi sáng", quan: "Mở quán", shop: "Cửa hàng" };
const UPGRADE_LABEL = { oxygen: "Oxy", hp: "Máu" };
const BUY_ERROR = { funds: "Chưa đủ tiền", max_level: "Đã đạt cấp tối đa", unknown: "Nâng cấp không hợp lệ" };
let panelKey = "";
dayPause.addEventListener("click", () => pressButton("pause"));

function uiText(tag, content) {
  const node = document.createElement(tag);
  node.textContent = content;
  return node;
}

function uiButton(label, action, disabled = false) {
  const button = uiText("button", label);
  button.type = "button";
  button.disabled = disabled;
  button.addEventListener("click", action);
  return button;
}

function stockLabel(stock = {}) {
  return Object.entries(stock).map(([kind, amount]) => `${KIND_NAME[kind] || kind} ×${amount}`).join(", ") || "trống";
}

function planLabel() {
  return Object.entries(snap.day_plan?.dishes || {}).map(([dish, count]) => `${dishName(dish)} ×${count}`).join(", ");
}

function gatherDetails() {
  const player = snap.player || {};
  const held = {};
  for (const kind of snap.hold || []) held[kind] = (held[kind] || 0) + 1;
  const targets = Object.entries(snap.day_plan?.ingredients || {}).map(([kind, count]) =>
    `${KIND_NAME[kind] || kind} ${held[kind] || 0}/${count}`);
  const inventory = targets.join(" · ");
  return `Oxy ${fmtTime(player.oxygen_ticks ?? 0)} · Máu ${player.hp ?? 0}/${player.hp_max ?? 0} · Giỏ ${(snap.hold || []).length}/${snap.hold_capacity ?? 0}${inventory ? " · " + inventory : ""}`;
}

function dayStats(stats) {
  const delta = stats.reputation_change;
  return `Ngày ${stats.day} · Phục vụ ${stats.served} · Rời bàn ${stats.left} · Thanh toán ${stats.paid} · Thu ${stats.revenue}k · Uy tín ${delta >= 0 ? "+" : ""}${delta.toFixed(1)}`;
}

function renderDayUI() {
  const isDay = snap.mode === "day";
  dayHud.hidden = !isDay;
  if (!isDay) {
    dayOverlay.hidden = true;
    return;
  }
  const screen = snap.ui?.screen || (snap.state === "paused" ? "paused" : snap.phase === "shop" ? "shop" : null);
  const days = snap.ui?.days || [];
  dayHud.hidden = screen === "menu" || screen === "exited";
  dayPause.hidden = Boolean(screen);
  dayTitle.textContent = `Ngày ${snap.day} · ${PHASE_LABEL[snap.phase]} · ${fmtTime(snap.time_left_ticks)} · Tiền ${snap.money}k · Uy tín ${snap.reputation.toFixed(1)} · Điểm ${snap.score}`;
  if (snap.phase === "gather") {
    dayDetails.textContent = gatherDetails();
  } else if (snap.phase === "quan") {
    const hand = snap.hand ? dishName(snap.hand.dish_id) : "trống";
    dayDetails.textContent = `Kho khả dụng: ${availableStock(snap) || "trống"} · Đang cầm: ${hand}`;
  } else {
    dayDetails.textContent = `Kho còn lại: ${stockLabel(snap.stock)}`;
  }
  dayOverlay.hidden = !screen;
  const lastBuy = screen === "shop" ? [...(snap.events || [])].reverse().find(event =>
    event.day === snap.day && (event.name === "bought" || event.name === "buy_failed")) : null;
  const key = JSON.stringify([screen, snap.day, snap.money, snap.upgrades, lastBuy]);
  if (!screen || key === panelKey) {
    const counter = document.getElementById("shop-counter");
    if (screen === "shop" && counter) counter.textContent = `Tiền ${snap.money}k · ${fmtTime(snap.time_left_ticks)}`;
    return;
  }
  panelKey = key;

  const title = {
    menu: "Quán Ăn Chợ Nổi", day_intro: `Ngày ${snap.day}`, evening_intro: "Buổi tối",
    day_result: `Kết quả ngày ${snap.day}`, shop: "Cửa hàng", paused: "Tạm dừng",
    summary: "Tổng kết", exited: "Đã thoát lượt chơi",
  }[screen];
  const nodes = [uiText("h1", title)];
  if (screen === "menu") {
    nodes.push(uiButton("Chơi", () => uiAction("start")), uiButton("Thoát", () => uiAction("exit")));
  } else if (screen === "day_intro") {
    nodes.push(uiText("p", planLabel()), uiButton("Bỏ qua", () => uiAction("continue")));
  } else if (screen === "evening_intro") {
    nodes.push(uiText("p", `Kho buổi sáng: ${stockLabel(snap.stock)}`), uiText("p", planLabel()),
      uiButton("Mở quán", () => uiAction("continue")));
  } else if (screen === "day_result") {
    const stats = days.find(entry => entry.day === snap.day);
    if (stats) nodes.push(uiText("p", dayStats(stats)));
    nodes.push(uiButton("Đến cửa hàng", () => uiAction("continue")));
  } else if (screen === "shop") {
    const counter = uiText("p", `Tiền ${snap.money}k · ${fmtTime(snap.time_left_ticks)}`);
    counter.id = "shop-counter";
    nodes.push(counter);
    for (const [name, options] of Object.entries(snap.meta?.upgrades || {})) {
      const level = snap.upgrades[name];
      const next = options.find(item => item.level === level + 1);
      const label = UPGRADE_LABEL[name] || name;
      nodes.push(uiButton(next ? `${label} cấp ${next.level} · ${next.price}k` : `${label} cấp ${level} · tối đa`,
        () => postInput({ buy: name }), !next));
    }
    if (lastBuy) {
      const message = lastBuy.name === "bought" ? "Nâng cấp có hiệu lực từ ngày sau" : BUY_ERROR[lastBuy.data.reason];
      nodes.push(uiText("p", message));
    }
    nodes.push(uiButton("Xong", () => pressButton("shop_done")), uiButton("Tạm dừng", () => pressButton("pause")));
  } else if (screen === "paused") {
    nodes.push(uiButton("Tiếp tục", () => pressButton("pause")), uiButton("Về menu", () => uiAction("menu")));
  } else {
    if (screen === "summary") {
      for (const stats of days) nodes.push(uiText("p", dayStats(stats)));
      nodes.push(uiText("p", `Tổng điểm: ${snap.score}`));
    }
    nodes.push(uiButton("Về menu", () => uiAction("menu")));
  }
  dayCard.replaceChildren(...nodes);
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const phase = snap.phase || snap.mode;
    if (phase === "quan") drawQuan(w, h);
    else if (phase === "gather") drawGather(w, h);
    renderDayUI();
    if (snap.mode !== "day") eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
